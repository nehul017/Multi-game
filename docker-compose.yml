version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: multigame-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - multigame-network

  redis:
    image: redis:7-alpine
    container_name: multigame-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - multigame-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multigame-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - multigame-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multigame-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - multigame-network

volumes:
  mongo-data:
  redis-data:

networks:
  multigame-network:
    driver: bridge
