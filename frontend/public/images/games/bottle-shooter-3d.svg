  </defs>
  <rect width="640" height="400" fill="url(#bsSky)"/>
  <rect x="0" y="250" width="640" height="150" fill="#7a6240"/>
  <rect x="70" y="268" width="500" height="18" rx="3" fill="#9a7348"/>
  <rect x="90" y="210" width="460" height="12" rx="3" fill="#8a653c"/>
