<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bottle Shooter 3D">
  <defs>
    <linearGradient id="bsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ea8d6"/>
      <stop offset="55%" stop-color="#d7c09a"/>
      <stop offset="100%" stop-color="#8c6a3e"/>
    </linearGradient>
    <linearGradient id="bsGlass" x1="0" y1="0" x2="1" y2="1">
