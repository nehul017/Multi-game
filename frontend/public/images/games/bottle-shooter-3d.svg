    <rect x="22" y="-16" width="10" height="20" rx="4" fill="url(#bsGlass)"/>
    <rect x="70" y="8" width="16" height="44" rx="7" fill="#3d6f92"/>
    <rect x="74" y="-8" width="8" height="18" rx="3" fill="#3d6f92"/>
    <rect x="118" y="-4" width="20" height="56" rx="8" fill="url(#bsGold)"/>
