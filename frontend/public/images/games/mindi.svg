<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Mindi Cot partnership table">
  <defs>
    <radialGradient id="mdRoom" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#1a1230"/>
      <stop offset="55%" stop-color="#0b0814"/>
      <stop offset="100%" stop-color="#05040a"/>
    </radialGradient>
    <radialGradient id="mdGlow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#3a1f68" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#3a1f68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mdFelt" cx="50%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#2a8a58"/>
      <stop offset="45%" stop-color="#146b3d"/>
      <stop offset="100%" stop-color="#08301c"/>
    </radialGradient>
    <linearGradient id="mdWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a2a"/>
      <stop offset="40%" stop-color="#4a2c14"/>
      <stop offset="100%" stop-color="#140c08"/>
    </linearGradient>
    <linearGradient id="mdGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d58a"/>
      <stop offset="100%" stop-color="#b8862a"/>
    </linearGradient>
    <linearGradient id="mdBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b1d78"/>
      <stop offset="55%" stop-color="#2d0b45"/>
      <stop offset="100%" stop-color="#140616"/>
    </linearGradient>
    <filter id="mdShade" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#mdRoom)"/>
  <ellipse cx="320" cy="214" rx="210" ry="118" fill="url(#mdGlow)"/>

  <ellipse cx="320" cy="248" rx="236" ry="78" fill="#000" opacity=".35"/>
  <ellipse cx="320" cy="208" rx="248" ry="132" fill="url(#mdWood)" filter="url(#mdShade)"/>
  <ellipse cx="320" cy="208" rx="228" ry="116" fill="none" stroke="url(#mdGold)" stroke-width="4"/>
  <ellipse cx="320" cy="208" rx="212" ry="102" fill="url(#mdFelt)"/>
  <ellipse cx="320" cy="198" rx="150" ry="48" fill="#9ad4b0" opacity=".08"/>

  <text x="320" y="168" text-anchor="middle" fill="#e8d5a0" fill-opacity=".28" font-family="Georgia, serif" font-size="11" letter-spacing="6">TEAM A  ·  TEAM B</text>

  <!-- North card (10 hearts) -->
  <g transform="translate(298 118) rotate(-8)">
    <rect width="44" height="62" rx="6" fill="#fff8ee" stroke="#d8c8a8"/>
    <text x="8" y="16" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#c41e3a">10</text>
    <text x="8" y="30" font-family="Georgia, serif" font-size="14" fill="#c41e3a">♥</text>
    <text x="16" y="44" font-family="Georgia, serif" font-size="18" fill="#c41e3a">♥</text>
  </g>
  <!-- West card (K diamonds) -->
  <g transform="translate(214 176) rotate(-18)">
    <rect width="44" height="62" rx="6" fill="#fff8ee" stroke="#d8c8a8"/>
    <text x="8" y="18" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#c41e3a">K</text>
    <text x="8" y="32" font-family="Georgia, serif" font-size="13" fill="#c41e3a">♦</text>
    <text x="16" y="46" font-family="Georgia, serif" font-size="18" fill="#c41e3a">♦</text>
  </g>
  <!-- East card (A spades) -->
  <g transform="translate(382 170) rotate(16)">
    <rect width="44" height="62" rx="6" fill="#fff8ee" stroke="#d8c8a8"/>
    <text x="8" y="18" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#141414">A</text>
    <text x="8" y="32" font-family="Georgia, serif" font-size="13" fill="#141414">♠</text>
    <text x="16" y="46" font-family="Georgia, serif" font-size="18" fill="#141414">♠</text>
  </g>
  <!-- South card (10 clubs) -->
  <g transform="translate(302 228) rotate(6)">
    <rect width="44" height="62" rx="6" fill="#fff8ee" stroke="#d8c8a8"/>
    <text x="8" y="16" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#141414">10</text>
    <text x="8" y="30" font-family="Georgia, serif" font-size="14" fill="#141414">♣</text>
    <text x="16" y="44" font-family="Georgia, serif" font-size="18" fill="#141414">♣</text>
  </g>

  <!-- Four seats -->
  <g font-family="Georgia, serif">
    <rect x="286" y="78" width="68" height="22" rx="11" fill="#1a1610" stroke="#c9a24a"/>
    <text x="320" y="93" text-anchor="middle" font-size="10" fill="#e8d5a0">TEAM A</text>
    <rect x="72" y="196" width="68" height="22" rx="11" fill="#1a1610" stroke="#7c3aed"/>
    <text x="106" y="211" text-anchor="middle" font-size="10" fill="#c4b5fd">TEAM B</text>
    <rect x="500" y="196" width="68" height="22" rx="11" fill="#1a1610" stroke="#7c3aed"/>
    <text x="534" y="211" text-anchor="middle" font-size="10" fill="#c4b5fd">TEAM B</text>
    <rect x="286" y="318" width="68" height="22" rx="11" fill="#1a1610" stroke="#c9a24a"/>
    <text x="320" y="333" text-anchor="middle" font-size="10" fill="#e8d5a0">YOU</text>
  </g>

  <!-- Hidden hands -->
  <g>
    <rect x="248" y="86" width="16" height="22" rx="2" fill="url(#mdBack)" stroke="#d4af37" stroke-width=".8"/>
    <rect x="258" y="84" width="16" height="22" rx="2" fill="url(#mdBack)" stroke="#d4af37" stroke-width=".8"/>
    <rect x="148" y="168" width="16" height="22" rx="2" fill="url(#mdBack)" stroke="#d4af37" stroke-width=".8" transform="rotate(-20 156 179)"/>
    <rect x="476" y="164" width="16" height="22" rx="2" fill="url(#mdBack)" stroke="#d4af37" stroke-width=".8" transform="rotate(18 484 175)"/>
  </g>

  <circle cx="320" cy="208" r="18" fill="#1a1208" stroke="url(#mdGold)" stroke-width="2"/>
  <text x="320" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#f0d58a">10s</text>

  <text x="320" y="52" text-anchor="middle" fill="url(#mdGold)" font-family="Georgia, serif" font-size="26" letter-spacing="4">MINDI COT</text>
</svg>
